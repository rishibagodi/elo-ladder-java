# All Services. A Service gives Pods one stable name and IP and finds them by
# label. The names db and cache become the hostnames the app connects to -
# the same hostnames as in docker-compose.
#
#   kubectl apply -f kube/service.yml -n qa        (same file for stage and prod)
#
# If the app's ENDPOINTS column is empty, the selector matches no Pod labels:
#   kubectl get endpoints elo-ladder -n qa

apiVersion: v1
kind: Service
metadata:
  name: elo-ladder
spec:
  type: NodePort
  selector:
    app: elo-ladder          # must match the Pod labels in deployment.yml
  ports:
    - port: 80               # the Service's port inside the cluster
      targetPort: 8080       # the container's port
      # No fixed nodePort: node ports are cluster-wide and this Service exists
      # in three namespaces - a hard-coded one would clash. Kubernetes picks.
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  selector:
    app: cache
  ports:
    - port: 6379
      targetPort: 6379